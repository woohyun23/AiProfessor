name: 문서 및 의사결정
description: 명세, ADR, 운영 문서와 기술 기록 작업을 계획합니다.
title: "[Docs] "
body:
  - type: dropdown
    id: document_type
    attributes:
      label: 문서 유형
      options:
        - 요구사항
        - API 명세
        - 테이블 및 ERD
        - ADR
        - 운영 및 Runbook
        - 개발 회고 및 블로그
        - 기타
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: 작성 목적
      description: 이 문서가 해결할 질문과 필요한 독자를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 포함할 내용
      description: 추가하거나 수정할 내용을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 현재 결정과 배경
        - [ ] 검토한 대안과 선택 근거
        - [ ] 후속 작업과 재검토 조건
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 근거 자료
      description: 관련 Issue, PR, 테스트 결과, 측정값 또는 기존 문서 링크를 작성해 주세요.

  - type: textarea
    id: completion
    attributes:
      label: 완료 조건
      description: 문서 완료 여부를 확인할 수 있는 조건을 작성해 주세요.
      placeholder: 예) 관련 API 명세와 충돌이 없고 후속 구현 Issue가 연결되어 있다.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 작성 전 확인
      options:
        - label: 기존 문서의 수정으로 해결할 수 있는지 확인했습니다.
          required: true
        - label: 구현된 사실과 아직 결정되지 않은 제안을 구분했습니다.
          required: true
