name: 버그
description: 재현 가능한 오류와 기대 동작을 기록합니다.
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 발생한 문제를 간결하게 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 다른 사람이 동일한 문제를 재현할 수 있도록 순서대로 작성해 주세요.
      placeholder: |
        1. 특정 API를 호출한다.
        2. 요청 본문에 ... 값을 전달한다.
        3. 응답을 확인한다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 정상이라면 어떤 결과가 나와야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제 응답, 상태, 오류코드 등을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 브랜치, 커밋, 운영체제, Java 버전 등 재현에 필요한 정보를 작성해 주세요.
      placeholder: 예) dev / commit abc123 / macOS / Java 21
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 로그 및 증거
      description: 민감정보를 제거한 로그, 스택 트레이스, 스크린샷을 첨부해 주세요.

  - type: textarea
    id: completion
    attributes:
      label: 수정 완료 조건
      description: 회귀 테스트를 포함한 완료 조건을 작성해 주세요.
      placeholder: |
        - [ ] 재현 테스트가 수정 전 실패하고 수정 후 성공한다.
        - [ ] 기존 테스트가 모두 통과한다.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 등록 전 확인
      options:
        - label: 기존 이슈에서 같은 문제가 보고되지 않았는지 확인했습니다.
          required: true
        - label: 로그와 이미지에서 비밀키·토큰·개인정보를 제거했습니다.
          required: true
